<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MARIK is a modern reading and discussion space for clubs, comments, and shared notes."
    />
    <meta name="theme-color" content="#121212" />
    <meta property="og:title" content="MARIK" />
    <meta
      property="og:description"
      content="Read together, annotate freely, and keep every club conversation in one place."
    />
    <meta property="og:type" content="website" />
    <title>MARIK | Shared Reading Space</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        min-height: 100vh;
        background: radial-gradient(circle at 15% 10%, #ffe9c6 0%, #f8f8f8 45%, #ececec 100%);
        color: #1f1f1f;
      }

      .home-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      .home-card {
        width: min(720px, 100%);
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 18px;
        padding: 2rem;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
      }

      .badge {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0.35rem 0.65rem;
        border-radius: 999px;
        background: #121212;
        color: #ffffff;
        margin-bottom: 1rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1.05;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: #404040;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="home-shell" aria-label="MARIK homepage">
        <section class="home-card">
          <span class="badge">MARIK</span>
          <h1>Welcome to MARIK</h1>
          <p>
            A shared reading space for clubs to annotate passages, discuss ideas, and keep every comment in context.
          </p>
        </section>
      </main>
    </div>
    <noscript>
      MARIK works best with JavaScript enabled. Please enable JavaScript to use the full app.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
