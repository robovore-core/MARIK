<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MARIK is a modern reading and discussion space for clubs, comments, and shared notes."
    />
    <meta name="theme-color" content="#121212" />
    <meta property="og:title" content="MARIK" />
    <meta
      property="og:description"
      content="Meow meow meow meow meow"
    />
    <meta property="og:type" content="website" />
    <title>MARIK | Shared Reading Space</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        min-height: 100vh;
        background: radial-gradient(circle at 15% 10%, #ffe9c6 0%, #f8f8f8 45%, #ececec 100%);
        color: #1f1f1f;
      }

      .home-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      .home-card {
        width: min(720px, 100%);
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 18px;
        padding: 2rem;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
      }

      .badge {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0.35rem 0.65rem;
        border-radius: 999px;
        background: #121212;
        color: #ffffff;
        margin-bottom: 1rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1.05;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: #404040;
      }

      .actions {
        margin-top: 1.5rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .btn {
        appearance: none;
        border: 1px solid #121212;
        border-radius: 999px;
        padding: 0.65rem 1rem;
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
        transition: transform 150ms ease, box-shadow 150ms ease, background-color 150ms ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn-primary {
        background: #121212;
        color: #ffffff;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
      }

      .btn-secondary {
        background: #ffffff;
        color: #121212;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="home-shell" aria-label="MARIK homepage">
        <section class="home-card">
          <span class="badge">MARIK</span>
          <h1>Welcome to MARIK</h1>
          <p>
            A shared reading space for clubs to annotate passages, discuss ideas, and keep every comment in context.
          </p>
          <div class="actions">
            <a id="app-entry-link" class="btn btn-primary" href="/" aria-label="Open app">Open MARIK</a>
            <a id="google-auth-link" class="btn btn-secondary" href="/auth/google" aria-label="Sign in with Google">
              Sign in with Google
            </a>
          </div>
        </section>
      </main>
    </div>
    <noscript>
      MARIK works best with JavaScript enabled. Please enable JavaScript to use the full app.
    </noscript>
    <script>
      const appLink = document.getElementById('app-entry-link')
      const authLink = document.getElementById('google-auth-link')

      function normalizeBasePath(pathname) {
        const withoutIndex = pathname.replace(/\/index\.html$/, '')
        const trimmed = withoutIndex.replace(/\/+$/, '')
        return trimmed || '/'
      }

      function joinPath(base, segment) {
        if (base === '/') {
          return `/${segment}`
        }

        return `${base}/${segment}`
      }

      if (authLink instanceof HTMLAnchorElement || appLink instanceof HTMLAnchorElement) {
        const appBasePath = normalizeBasePath(window.location.pathname)
        const frontendUrl = encodeURIComponent(`${window.location.origin}${appBasePath === '/' ? '' : appBasePath}`)

        if (appLink instanceof HTMLAnchorElement) {
          appLink.href = appBasePath
        }

        const authBase =
          window.location.hostname === 'localhost' && window.location.port !== '4000'
            ? 'http://localhost:4000'
            : ''

        if (authLink instanceof HTMLAnchorElement) {
          const authPath = joinPath(appBasePath, 'auth/google')
          authLink.href = `${authBase}${authPath}?frontendUrl=${frontendUrl}`
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
